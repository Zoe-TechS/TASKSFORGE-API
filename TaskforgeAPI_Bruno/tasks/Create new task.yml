info:
  name: Create new task
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/api/tasks
  body:
    type: json
    data: |-
      {
        "title": "Destiny",
      "description": "Change your destiny",
      "projectId": 1,
